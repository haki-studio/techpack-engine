# HAT STYLE CATALOGUE — one entry per block (mould) we make hats on. A hat tech pack is built from ONE key here
# (intake asks for it; dispatch refuses a hat project without it). Validate: python3 engine/capstyle.py check
#
# Value convention (same as families/tee): {value: x, source: "..."} = confirmed; {proposed: x, note: "..."} = not
# recorded / inferred / in conflict -> amber "[proposed — confirm]" + an F1 factory question. A plain value with no
# source is refused by capstyle.py. Facts: HakiCode/missions/techpack-engine-m2/hat-styles-facts.md ([F] -> value,
# [I] / untagged / conflict -> proposed).
#
# kind: cap    = cut-and-sew baseball / trucker cap (5 or 6 crown panels + brim). POMs A-H required.
#       bucket = cut-and-sew bucket hat (crown band + top + all-round brim). POMs A, B, T, E required.
#       knit   = knitted beanie (no cut-and-sew flats). POMs W, L, C required + a knit: block.
# POM: {name, how, unit (default cm), value + source | proposed + note, tol (optional)}.

pom_sets:
  cap:
    A: {name: Head circumference, how: "inside the sweatband, at its middle, strap at its middle setting"}
    B: {name: Front panel height, how: "CF, from the sweatband seam up the front panel to its top edge"}
    C: {name: Back height, how: "CB, from the crown base edge (top of the strap opening excluded) to the button"}
    D: {name: Crown depth, how: "CF base edge over the button to the CB base edge, along the surface"}
    E: {name: Brim length, how: "centre of the brim, from the crown seam to the brim edge, flat"}
    F: {name: Brim width, how: "straight across the brim at the crown seam, end to end"}
    G: {name: Brim curve, how: "brim upside down on a table: gap between the table and the brim edge at the centre"}
    H: {name: Strap length, how: "visible / effective strap length on the finished cap, from the back panel edge"}
    J: {name: Front panel width, how: "at the crown base, seam to seam", optional: true}
    K: {name: Side panel width, how: "at the crown base, seam to seam", optional: true}
    M: {name: Back panel width, how: "at the crown base, seam to seam (each back panel)", optional: true}
  bucket:
    A: {name: Head circumference, how: "inside the sweatband, at its middle"}
    B: {name: Crown height, how: "side, from the brim seam to the top seam"}
    T: {name: Top length, how: "crown top oval, front to back, seam to seam"}
    E: {name: Brim width, how: "from the brim seam to the brim edge, along the brim, at the front"}
  knit:
    W: {name: Width flat, how: "laid flat, cuff folded, at the cuff edge, side to side"}
    L: {name: Height, how: "laid flat, cuff folded, from the cuff edge to the top of the crown"}
    C: {name: Cuff depth, how: "folded cuff, from the fold to the cuff edge"}

