# Digitizing run: Castle Falls BK size M, benchmark crop (ENGINE_PLAN M1, organic parts M2).
#   python3 -m digitize.run projects/castle-falls-jacket/bench/run_bk_crop.yaml --stages all --no-api
# Paths are relative to the project folder (the folder above bench/). No Anthropic API calls anywhere in this run.
name: BK_M_crop
label: "M3b trees, crowns, florets"
bench: bench/bench.json            # crop, view, registration, close-up, targets
zones: bench/zones_BK.json         # hand-authored zones for the crop (from the images)
out_dir: out/digitize/BK_M_crop

techniques:                        # toggles: the rulebook takes the first ENABLED technique per kind
  tatami: true
  satin: true
  split_satin: true
  run: true
  bean: true
  guided_fill: true                # M2: tatami along the reference grain (strata, cloud lobes)
  contour_fill: true               # M2: rows along the outline (cloud lobes when guided_fill is off)
  blend: true                      # M2: open shading layers and feather blends (no underlay)

threads:
  needles: factory                 # factory.json: 12 colours per stitch file
  protected: [cf_red, cf_gold]     # never merged (founder: red and gold present wherever the design has them)
  # importance x area in the merge cost (threads.py). M1 merged BOTH water blues away (area-weighted), so the falls were
  # cream + mist only. 12 needles cannot hold all 18 tones: keeping sky light (the falls' blue streaks) and blossom deep
  # costs mist grey -> sky light (dE 14.9); keeping both blues as well would cost blossom deep or cloud cream
  # (RECAP-2026-10-20-engine-m2-organic.md). Change these numbers to move the trade-off.
  importance: {cf_skylt: 3, cf_rose: 3}
  # candidate palette = the Castle Falls tones read from the mockup (cfcore.CF_PAL, PROPOSED threads); the evidence
  # classifies every reference pixel to the nearest one, then threads.py merges down to the needle limit
  palette:
    cf_white: "#EEEAE0"
    cf_cream: "#D4CABA"
    cf_mist: "#9EA3A6"
    cf_skylt: "#79A4D0"
    cf_sky: "#3F6FA9"
    cf_navy: "#22355C"
    cf_slate: "#566577"
    cf_lav: "#9690B6"
    cf_grndk: "#2F402D"
    cf_grn: "#5A7240"
    cf_grnlt: "#9DA65F"
    cf_pinklt: "#F2C3CE"
    cf_pink: "#DE8EA6"
    cf_rose: "#B4506F"
    cf_red: "#B23F2E"
    cf_gold: "#D3A63F"
    cf_bark: "#958262"
    cf_brown: "#4E3F31"
  names:
    cf_white: Cloud white
    cf_cream: Cloud cream
    cf_mist: Mist grey
    cf_skylt: Sky light
    cf_sky: Sky blue
    cf_navy: Deep navy
    cf_slate: Rock slate
    cf_lav: Far lavender
    cf_grndk: Pine dark
    cf_grn: Leaf green
    cf_grnlt: Moss light
    cf_pinklt: Blossom pale
    cf_pink: Blossom pink
    cf_rose: Blossom deep
    cf_red: Vermilion
    cf_gold: Gold
    cf_bark: Bark tan
    cf_brown: Bark dark

evidence: {ppm: 4.0, smooth_mm: 0.35, mode_mm: 0.6}
sequence: {keep_mm: 1.0, min_fragment_mm2: 2.0}
stub: {min_part_mm2: 20.0, min_protected_mm2: 4.0, close_mm: 0.6}
fall: {cords_min: 4, cords_max: 10, cord_mm: 5.0}
sky: {min_band_mm: 3.0, blend_mm: 2.5}
budget: {stitches_max: null}       # crop only; a full back is 250-350k (rule 6)
direction: {sigma_mm: 4.0, fill_sigma_mm: 10.0, min_coh: 0.25}   # M2 field: grain smoothed over 4 mm, weak grain (< 0.25) from 10 mm
stratum: {min_mass_mm2: 40.0, min_band_mm: 4.0, max_band_mm: 16.0, min_part_mm2: 30.0, crack_depth: 35.0, max_cracks: 4}
cloud: {wisp_mm: 3.0, lobe_sep_mm: 4.0, min_lobe_mm2: 25.0, min_shade_mm2: 8.0, min_wisp_mm2: 10.0}
specks: {min_mm2: 20.0}            # M2: traced parts under 20 mm2 merge into the neighbour they share most border with

# --- M3b --- trees, crowns, blossoms (extract/splitters/trunk.py, crown.py, blossom.py); numbers = the splitters' defaults
separate_kinds: [stratum_band, cloud_shade, cloud_wisp, canopy, crown_clump_dark, crown_clump_lit, trunk_strip, branch]   # rule 3 turns (<= 25 deg, audited)
blossom: {min_mass_mm2: 15.0, canopy_share: 0.15, floret_sep_mm: 3.0, floret_min_mm2: 5.0, floret_r_max: 3.2, floret_r_min: 1.5, fit: 1.35, knot_d: 1.5, notch_mm: 0.6}
crown: {min_mass_mm2: 20.0, clump_sep_mm: 6.0, min_clump_mm2: 20.0, min_lit_mm2: 6.0, support_mm: 4.0}
trunk: {min_mm2: 6.0, support_frac: 0.35, min_w_mm: 1.0, strip_split_mm: 3.0, strip_mm: 2.5, max_turn_deg: 25.0}
