# House rulebook v1 (ENGINE_PLAN M1, organic kinds M2). kind -> techniques (FIRST ENABLED WINS; none enabled = hard error),
# direction, z, stitch numbers. The founder numbers under `principles` come from docs/DIGITIZING_PRINCIPLES.md
# (approved 19 Oct 2026) and are pinned by tests/test_digitize_m1.py::test_rulebook_matches_principles: change them
# only together with the principles document.
version: 1

principles:
  satin_min_w_mm: 1.0          # rule 4 / rule 9: satin >= 1 mm
  satin_max_w_mm: 7.0          # rule 4: satin 1-7 mm wide, split above 7 mm
  fill_min_w_mm: 5.0           # rule 4: fill only where the part is >= ~5 mm wide
  run_max_w_mm: 1.0            # rule 4: run or bean below 1 mm
  satin_min_aspect: 2.5        # LESSONS A16: satin only on stroke-like shapes
  neighbour_sep_deg: [15, 25]  # rule 3: same-colour neighbours differ by 15-25 deg
  cut_keep_mm: 1.0             # rule 6: remove overlaps, keeping ~1 mm
  max_stacked_layers: 2        # rule 6: never more than 2 stacked top layers
  budget_back_stitches: [250000, 350000]   # rule 6: a full jacket back
  pull_comp_mm: 0.2            # rule 7: ~0.2 mm pull compensation on duck
  text_min_mm: 5.0             # rule 9
  stud_mm: [1.0, 1.5]          # rule 9
  shading_underlay: false      # rule 7: no underlay on shading layers

techniques:                    # defaults; a kind may override any of these numbers
  tatami:      {spacing: 0.45, stitch_len: 3.5, underlay: [edge_run, lattice_90], pull_comp: 0.2, lattice_min_mm2: 60.0}
  satin:       {spacing: 0.42, stitch_len: 7.0, underlay: [centre_run], pull_comp: 0.2, edge_run_min_w: 4.0}
  split_satin: {spacing: 0.42, stitch_len: 5.5, underlay: [centre_run], pull_comp: 0.2, stagger: 0.25}
  run:         {spacing: 0.0, stitch_len: 2.5, underlay: [], pull_comp: 0.0}
  bean:        {spacing: 0.0, stitch_len: 2.0, underlay: [], pull_comp: 0.0}
  guided_fill: {spacing: 0.45, stitch_len: 3.5, underlay: [edge_run, lattice_90], pull_comp: 0.2, lattice_min_mm2: 60.0}
  contour_fill: {spacing: 0.45, stitch_len: 3.0, underlay: [edge_run], pull_comp: 0.2, lattice_min_mm2: 60.0}
  blend:       {spacing: 1.0, stitch_len: 3.0, underlay: [], pull_comp: 0.0, mode: feather}   # rule 7: no underlay on shading
  # M5 (SVG parity on Konpeito, patches). column_satin density is SAME-SIDE (konpeito ENGINE_NOTES 7): the row
  # spacing is half of it; `spacing` is not read. dot: needle = art - allow, never below min_d (house-min reported).
  column_satin:  {spacing: 0.20, stitch_len: 5.5, underlay: [centre_run], pull_comp: 0.10, same_side: {40wt: 0.40, 60wt: 0.28}, centre_run_min_w: 1.4, centre_run_min_len: 2.5, max_piece: 5.5, stagger: 0.25}
  dot:           {spacing: 0.18, stitch_len: 1.5, underlay: [cross], pull_comp: 0.0, min_d: 1.1, allow: 0.2}
  radial:        {spacing: 0.36, stitch_len: 7.0, underlay: [edge_run], pull_comp: 0.10, allowed_kinds: [floret, star, star_tint, ring, radial]}
  turning_satin: {spacing: 0.30, stitch_len: 7.0, underlay: [centre_run], pull_comp: 0.15, short: false}
  # M6: puff = dense satin over foam, no underlay (allowed: [tack]), rows never split; chenille / chain on a chenille
  # head (spacing = moss path spacing); faux_chain = lock-stitch chain loops for the Brother heads.
  puff:        {spacing: 0.20, stitch_len: 7.0, underlay: [], pull_comp: 0.0, min_w: 3.0, max_w: 7.0, max_spacing: 0.30, cap_w: 1.5, cap_ext: 0.5, perf_step: 0.5, foam_mm: 3.0, foam_min_mm: 2.0, foam_max_mm: 4.0, foam_colour: match thread, needle: "75/11 sharp [proposed - confirm]", spm: "600 [proposed - confirm]"}
  chenille:    {spacing: 2.0, stitch_len: 2.5, underlay: [], pull_comp: 0.0, mode: spiral, moss_len: 2.5, chain_len: 2.0, outline_inset: 0.8, loop_height_mm: 4.0, outline: true, outline_dir: ccw}
  chain:       {spacing: 0.0, stitch_len: 2.0, underlay: [], pull_comp: 0.0, chain_len: 2.0}
  faux_chain:  {spacing: 0.0, stitch_len: 2.5, underlay: [], pull_comp: 0.0, link: 2.5, half_w: 0.45, overlap: 0.3, max_stitch: 3.0}

kinds:
  sky_band:
    techniques: [tatami]
    dir: 0                     # motif playbook: sky = horizontal tatami bands, 0 deg
    z: 0                       # sewn first, cut away under everything above (no bare duck)
    note: horizontal tatami band; sewn first and cut under
  sky_blend:
    techniques: [blend, tatami]
    dir: 0
    z: 0.5
    spacing: 1.0               # rule 8: gradient from density (two-colour blend, open layer)
    underlay: []               # rule 7: no underlay on shading layers
    pull_comp: 0.0
    params: {mode: feather}    # rows from the upper band's edge, thinning into the band below (accordion)
    note: two-colour blend into the band below (open layer, feathered)
  fall_cord:
    techniques: [split_satin, tatami]
    dir: 90                    # playbook: falls = 4-10 cords of split satin, vertical
    z: 3
    note: one cord along the fall's medial axis; alternating tones
  pool:
    techniques: [tatami]
    dir: 0                     # playbook: pools horizontal
    z: 3.5
    note: horizontal tatami where the fall lands
  stratum_band:                # playbook: cliffs/strata = one object per band, guided tatami along the bedding plane
    techniques: [guided_fill, tatami]
    dir: field                 # the reference grain (structure tensor), rows follow it (guided fill)
    alt_dir: 90                # only if guided_fill is switched off: plain tatami, near-vertical (near cliffs, rule 3)
    band_offset_deg: 10        # bands alternate +10 / -10 deg off the grain: neighbours differ 20 deg (playbook +-15-25)
    note: one bedding band (x one thread) of a cliff; guided tatami along the plane
  stratum_crack:
    techniques: [run, bean]
    dir: contour               # along the traced crack line
    follows: [run, bean]       # line techniques follow their line by construction
    z_offset: 0.6              # sewn on top of the bands (playbook: cracks as run on top)
    note: a dark crack line across the strata, run on top
  cloud_lobe:                  # playbook: clouds = one object per lobe, contour / turning fill or near-vertical split satin
    techniques: [guided_fill, contour_fill, split_satin, tatami]
    dir: field
    dir_by_technique: {guided_fill: field, contour_fill: contour}   # turning fill along the lobe's grain, or the outline
    alt_dir: 80                # split satin / tatami: near-vertical (playbook)
    note: one cloud lobe; turning (guided) fill along the reference grain, or contour fill; back lobes first
  cloud_shade:                 # playbook: shade as an open layer
    techniques: [blend]
    dir: field-mean            # measured grain over the shade (fixed rows)
    spacing: 1.2               # open layer (rule 8)
    underlay: []               # rule 7: no underlay on shading layers
    pull_comp: 0.0
    params: {mode: open}
    z_offset: 0.3
    note: the lobe's shaded tone as an open layer on top of the lobe
  cloud_wisp:                  # playbook: wisps at the sky angle, half density
    techniques: [tatami]
    dir: 0                     # = sky_band (tests pin it)
    spacing: 0.9               # half density (2 x the tatami 0.45)
    underlay: []
    note: thin wisp of cloud, at the sky angle, half density
  zone_stub:
    techniques: [tatami]
    dir: field-mean            # the reference grain's mean over the part (structure tensor): declared, never random
    note: stand-in for zones whose splitter is not built yet (M3 replaces it - buildings, trunks, crowns, florets)

  # ---- M5: patches from founder vector art (extract/svg.py). dir "geometry" = declared by the extractor from the
  # part's own geometry rule (across the band / stroke / petal axis, radial), with source "rule"; never auto.
  # Numbers = what the delivered Konpeito Rev A files sew (kjcore + dst2: tatami 0.45, patch satins 0.36).
  patch_band:
    techniques: [tatami]
    dir: geometry              # across the band: 90 deg on top / bottom, 0 deg on the sides
    underlay: [edge_run, lattice_90]
    note: house patch band under the border motifs, runs 0.3 mm under the field and 1.4 mm under the edge
  patch_field:
    techniques: [tatami]
    dir: 0
    underlay: [edge_run, lattice_90]
    note: patch field, motifs sew ON it (house patch spec - no cut-under on patches)
  patch_edge:
    techniques: [column_satin]
    dir: geometry
    same_side: 0.36
    pull_comp: 0.15
    underlay: []
    note: heat-cut edge, a closed 2 mm column on the outline, sewn LAST
  floret:
    techniques: [radial]
    dir: geometry
    underlay: []
    note: 5-petal border flower (the SVG's ellipses), radial, red centre left open
  star:
    techniques: [radial]
    dir: geometry
    pull_comp: 0.15
    note: puffy star body, radial from its centre
  star_tint:
    techniques: [radial]
    dir: geometry
    underlay: []
    note: star highlight on top of its body, radial
  ring:
    techniques: [radial]
    dir: geometry
    underlay: []
    note: small ring (handakuten) - a column's inner ends would collapse
  lettering:
    techniques: [column_satin]
    dir: geometry              # across the stroke
    note: satin columns on the SVG outline's centrelines, ONE needle width per string (art - 0.15 mm)
  line_art:
    techniques: [column_satin]
    dir: geometry
    pull_comp: 0.0
    underlay: []
    note: face line art (60wt), one width
  petal:
    techniques: [turning_satin]
    dir: geometry              # across the petal axis (centre -> tip)
    note: one satin per petal / candy lobe
  petal_tint:
    techniques: [turning_satin]
    dir: geometry
    pull_comp: 0.10
    underlay: []
    note: tint centre shape on top of its candy / flower
  dot:
    techniques: [dot]
    dir: geometry
    note: bead dot (accent dots, cheeks, border dots, eyes), needle = art - 0.2, house minimum 1.1
  knot:
    techniques: [dot]
    dir: geometry
    min_d: 0.9
    note: white specks / flower-centre beads (knot size, minimum 0.9)

  # --- M3b --- trees, crowns, blossoms (extract/splitters/trunk.py, crown.py, blossom.py). dir "construct" = the angle is
  # BUILT by the splitter from the part's geometry (DirSpec source "splitter", meta construct) and rebuilt by
  # digitize.audit (extract/splitters/construct.py): trunk strips along the traced axis, branches as a column across the
  # stroke, clumps fanning along their long axis from the attachment end. Florets reuse the M5 kinds floret (radial,
  # DirSpec mode "radial") + knot (bead dot).
  canopy:                      # playbook: blossoms = canopy random tatami -> florets -> branches
    techniques: [tatami]
    dir: field-mean            # the measured grain over the mass (fixed rows; self-derived, like the stubs); rule 3 turns it
    note: the shadow tone of a blossom mass under its florets, tatami
  trunk_strip:                 # playbook: trees = trunk as split-satin strips along the axis
    techniques: [split_satin, tatami]
    dir: construct             # along the traced axis (construct rule "axis")
    note: one strip of a trunk segment, split satin along the axis; same-thread strips alternate +-10 deg
  branch:                      # playbook: blossoms -> branches last
    techniques: [split_satin]
    dir: construct             # a satin column across the stroke along the traced centreline (construct rule "column")
    follows: [split_satin]     # column mode follows the centreline (DirSpec mode contour)
    params: {mode: column}
    z_offset: 0.0              # with the trunk zone (6.5): BEFORE the canopy. Branches sit in the gaps between blossoms (exclusive
                               # pixels), so the order only decides the 1 mm seam; sewn first, their travel hides under the
                               # canopy (B2). The playbook order "-> branches" last cost ~1 trim per branch island (M3b run r5).
    note: a branch segment (narrower than a trunk strip), split satin along the axis
  crown_clump_dark:            # playbook: crowns as clumps (dark, then lit); clumps fan from the branch
    techniques: [tatami]
    dir: construct             # fan: from the attachment point to the clump centre (construct rule "fan")
    note: one foliage clump in its shadow tone, its lit pieces knocked out (they sew first, B2 / B14)
  crown_clump_lit:
    techniques: [tatami]
    dir: construct
    note: the lit tone of a clump, sewn before its dark part (knocked out of it), fanning from the same attachment point
  # --- M3a --- constructed parts: buildings (extract/splitters/building.py, extract/building_fit.py). dir "construct" =
  # a RULE applied to the fitted geometry (source "rule", independent of the reference grain, LESSONS A24); `construct`
  # names the rule and digitize.audit re-derives the angle from the fitted points the part stores (building_fit.rule_basis).
  # Playbook: wall tatami; eave satin; roof down-slope with bean tile lines; windows as satin bands; one angle per plane;
  # walls -> roofs bottom-up -> eaves -> tile lines -> windows -> studs last (z offsets in the splitter).
  wall:
    techniques: [tatami]
    dir: construct
    construct: course          # one angle per plane, square to the eave of the roof above; rule 3 depth: under a far roof
                               # along the courses (near-horizontal), under a near roof across them (near-vertical); 0 without a roof
    params_from: roof          # near_tier_rel
    note: one wall plane, tatami along (far) / across (near) the courses
  roof:
    techniques: [tatami]
    dir: construct
    construct: down_slope      # NEAR tier: front plane perpendicular to its eave line, hip planes fan halfway to their hip line
                               # FAR tier (rule 3 depth: far = near-horizontal): rows along the eave, hips along their hip line
    params: {hip_min_sep: 20.0, hip_max_sep: 45.0, near_tier_rel: 0.75}   # hips 20-45 deg off the front (rule 3)
                               # near_tier_rel: rule 3 depth RELATIVE to scale. Tiers of one style shrink with distance, so
                               # the largest tiers on the piece are the nearest: a tier under 0.75 x the zone's largest tier
                               # (a quarter smaller = clearly further back) is FAR. The default is a perspective argument, not
                               # fitted to the crop; the choice it makes moves the grain gate (BENCH_m3a.md), so a far / near
                               # result there is partly grain-informed. null = every tier down the slope (playbook only).
    note: one roof plane, tatami down the slope (near) / along the eave (far)
  eave:
    techniques: [column_satin, satin]      # same-side density (LESSONS B26); M1 satin spacing is per row
    dir: construct
    construct: across          # members across their width (rule 2)
    note: eave band along the fitted eave line, satin across
  roof_tile_line:
    techniques: [bean, run]
    dir: construct
    construct: down_slope
    params_from: roof
    note: tile rows down the slope of their plane, bean (rule 9 - tiles as run lines)
  window:
    techniques: [column_satin, satin]
    dir: construct
    construct: across
    note: a row of windows as one satin band (rule 9 - windows as bands), across the band
  member:
    techniques: [column_satin, satin]
    dir: construct
    construct: across
    note: timber / trim member, satin across its width (rule 2)
  stud:
    techniques: [dot]
    dir: 0                     # a bead: one row angle by rule
    params: {min_d: 1.0, max_d: 1.5}   # rule 9: studs 1-1.5 mm (principles stud_mm)
    underlay: []               # flat studs on the fill: the dot's 0.45 mm cross underlay reads back as a sub-1 mm satin
                               # column (qa.satin_runs too-narrow) on a 1-1.5 mm bead
    note: stud / ornament bead, sewn last

  # --- M6 --- specialty kinds (puff / chenille / chain). Numbers are house proposals from published practice, cited in
  # projects/castle-falls-jacket/bench/BENCH_m6.md, [proposed - confirm] at the factory's strike-off.
  puff_column:
    techniques: [puff]         # satin columns over foam ONLY: no tatami fallback (fill flattens foam)
    dir: geometry              # across the column, by construction
    note: 3D foam satin column, 3-7 mm wide (LESSONS B7 7.5 mm stitch cap), perforated + capped ends, own stop (lay foam)
  chenille_fill:
    techniques: [chenille]     # sewn on a chenille head; no lock-stitch fallback for moss loops
    dir: 0                     # zigzag moss rows run at this angle; spiral moss follows the outline
    note: chenille moss (loop) fill + chain outline - a plan until the factory gives the chenille file format (F1)
  chain_line:
    techniques: [chain, faux_chain]   # true chain on a chenille head when enabled, else the Brother lock-stitch chain
    dir: contour
    follows: [chain, faux_chain]
    note: chain-stitch line

  # --- G1 --- generic primitive kinds (engine/digitize/primitives, fed by parts.labels.json). dir "label" = the labels
  # compiler declares every angle itself (construct axis / column / long_axis / radial, the label angle, or the grain);
  # the rulebook only picks the technique and its numbers. Same numbers as the subject kinds they replace.
  stroke:                      # 1-7 mm strokes: a satin column across the stroke (= branch)
    techniques: [split_satin]
    dir: label
    follows: [split_satin]
    params: {mode: column}
    note: a stroke, satin column across it along the traced centreline
  cord:                        # falls, trunks, vines: split satin along the cord (= fall_cord / trunk_strip)
    techniques: [split_satin, tatami]
    dir: label
    note: one cord along the mass's medial axis; alternating tones
  band:                        # sky, far roof rows, stripes: tatami along the band (= sky_band)
    techniques: [tatami]
    dir: label
    note: one strip of a band, tatami along its run (or at the labelled angle)
  band_grain:                  # strata: guided tatami along the reference grain (= stratum_band)
    techniques: [guided_fill, tatami]
    dir: label
    alt_dir: 90
    note: one band x thread following the grain, alternating +-10 deg
  lobe:                        # clouds, leaves, crowns, petals: one part per lobe at its own axis / the labelled angle
    techniques: [tatami]
    dir: label
    note: one lobe, tatami along its own long axis (outline) or the labelled angle
  lobe_grain:
    techniques: [guided_fill, tatami]
    dir: label
    alt_dir: 80
    note: one lobe, guided fill along the reference grain
  lobe_shade:                  # = cloud_shade: an open layer, no underlay (rules 7, 8)
    techniques: [blend]
    dir: label
    spacing: 1.2
    underlay: []
    pull_comp: 0.0
    params: {mode: open}
    note: a lobe's darker tone as an open layer on top
  plane:                       # walls, roofs, flat areas: tatami at one deliberate angle
    techniques: [tatami]
    dir: label
    note: one plane x thread, tatami at the labelled angle
  plane_grain:                 # a radial cluster's ground at the grain's mean (= canopy)
    techniques: [tatami]
    dir: label
    note: the ground of a radial cluster, tatami at the measured grain mean (self-derived)
  radial:                      # florets, fins, tails: radial satin from each centre (= floret)
    techniques: [radial]
    dir: label
    underlay: []
    spacing: 0.45
    note: one radial cluster member, rays from its centre
  bead:                        # eyes, studs, knots: a bead (= knot / stud)
    techniques: [dot]
    dir: label
    params: {min_d: 0.9}
    note: a bead dot
  line:                        # outlines, cracks, tile lines: run / bean along the traced line (= stratum_crack)
    techniques: [bean, run]
    dir: contour
    follows: [run, bean]
    note: a run / bean along a traced line

# --- M4c --- radial-floret exemption for the 8 mm chaos gate (engine/digitize/gates_radial.py; PR #10 review). A chaotic
# tile is exempt only when >= min_radial_share of its visible stitch length belongs to FLORET-SIZE radial parts (farthest
# outline point <= floret_r_max_mm from the centre) AND >= min_adherence_pct of those stitches in the tile lie within
# max_dev_deg of their ray. The chaos threshold (bench.json direction_pct_chaos_max, 5 %) is not changed by this.
chaos_radial_exemption: {min_radial_share: 0.70, min_adherence_pct: 85.0, floret_r_max_mm: 4.0, max_dev_deg: 15.0}
