name: tests

# Runs the engine's pytest suite (CLAUDE.md "Tests"). No Anthropic API calls anywhere in this suite.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      # cairosvg/cairocffi need the system cairo library
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
